[package]
name = "sysmon"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["Jcode"]
description = "Modern real-time system and server monitoring dashboard written in pure Rust. Reads live metrics from /proc and /sys and streams them to a modern web UI over WebSocket."
license = "MIT"
readme = "README.md"
repository = "https://github.com/1jehuang/jcode"
keywords = ["monitoring", "system", "metrics", "dashboard", "observability"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "sysmon"
path = "src/main.rs"

[[bin]]
name = "agent-monitor"
path = "src/bin/agent_monitor.rs"

[dependencies]
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process"] }
axum = { version = "0.8", features = ["ws", "json", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace", "cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
num_cpus = "1"
mime_guess = "2"
parking_lot = "0.12"
once_cell = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
futures = "0.3"
argon2 = "0.5"
rand = "0.8"
portable-pty = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.bench]
opt-level = 3
