<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0e17" />
    <meta
      name="description"
      content="SysMon - modern real-time system and server monitoring dashboard"
    />
    <title>SysMon · System Monitor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/charts.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/enhanced.css" />
    <link rel="stylesheet" href="/css/glossy.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- Sidebar, topbar, and content are rendered by app.js -->
    </div>

    <div id="scrim" class="scrim"></div>
    <div id="toast-root"></div>
    <div id="tooltip-root"></div>

    <noscript>
      <div style="padding: 40px; text-align: center; color: #c3ccdf">
        SysMon requires JavaScript to display live metrics.
      </div>
    </noscript>

    <!-- Application modules (ES modules, loaded in dependency order) -->
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
